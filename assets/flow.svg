<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Business flow: Lead, CRM, Automation, Dashboards, Decisions">
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;text-anchor:middle}
    .n{fill:#0F172A;stroke:#2DD4BF;stroke-width:1.5}
    .l{font-size:16px;font-weight:700;fill:#F8FAFC}
    .s{font-size:12px;fill:#94A3B8}
    .ln{stroke:#0EA5E9;stroke-width:2;stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @media (prefers-reduced-motion:reduce){.ln{animation:none}}
  </style>
  <g>
    <line class="ln" x1="170" y1="75" x2="215" y2="75"/>
    <line class="ln" x1="370" y1="75" x2="415" y2="75"/>
    <line class="ln" x1="570" y1="75" x2="615" y2="75"/>
    <line class="ln" x1="770" y1="75" x2="815" y2="75"/>
  </g>
  <rect class="n" x="10"  y="35" width="160" height="80" rx="12"/>
  <rect class="n" x="215" y="35" width="155" height="80" rx="12"/>
  <rect class="n" x="415" y="35" width="155" height="80" rx="12"/>
  <rect class="n" x="615" y="35" width="155" height="80" rx="12"/>
  <rect class="n" x="815" y="35" width="175" height="80" rx="12"/>
  <text class="l" x="90"  y="72">Lead</text><text class="s" x="90"  y="93">Web · Upwork</text>
  <text class="l" x="292" y="72">CRM</text><text class="s" x="292" y="93">ModuNexo</text>
  <text class="l" x="492" y="72">Automation</text><text class="s" x="492" y="93">n8n workflows</text>
  <text class="l" x="692" y="72">Dashboards</text><text class="s" x="692" y="93">Power BI</text>
  <text class="l" x="902" y="72">Decisions</text><text class="s" x="902" y="93">Better, faster</text>
</svg>
